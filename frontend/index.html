<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2V - Beach Volley Vibes | Toulouse</title>

    <!-- 1. Google Fonts : Inter & Russo One -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Russo+One&display=swap" rel="stylesheet">

    <!-- 2. Bootstrap 5 CSS via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- 3. CSS personnalisé B2V -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- ==========================================================================
    BARRE DE NAVIGATION COMMUNE (SPA)
    ========================================================================== -->
    <header class="sticky-top">
        <nav class="navbar navbar-expand-lg bg-white border-bottom py-2">
            <div class="container">
                <!-- Logo B2V (Lien SPA) -->
                <a class="navbar-brand d-flex align-items-center py-0" href="/" onclick="route()">
                    <img src="assets/images/Logo_B2V.png" alt="Logo B2V - Beach Volley Vibes" class="header-logo" height="45" style="max-height: 45px; width: auto;">
                </a>

                <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Menu de navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="mainNavbar">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0 gap-lg-3 align-items-lg-center">
                        <li class="nav-item">
                            <a class="nav-link text-dark-blue font-medium" href="/" onclick="route()">Accueil</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-dark-blue font-medium" href="/club" onclick="route()">Le Club</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-dark-blue font-medium" href="/faq" onclick="route()">FAQ</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-dark-blue font-medium" href="/contact" onclick="route()">Contact</a>
                        </li>
                        <!-- Conditionnel : Achat de sessions (injecté / affiché si connecté) -->
                        <li class="nav-item d-none" id="nav-sessions">
                            <a class="nav-link text-dark-blue font-medium" href="/sessions" onclick="route()">Achat de sessions</a>
                        </li>
                        <!-- Connexion / Mon Compte -->
                        <li class="nav-item ms-lg-2" id="nav-auth-container">
                            <a href="/login" onclick="route()" class="btn btn-outline-b2v btn-sm px-3" id="btn-login">Connexion</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- ==========================================================================
    CONTENEUR DYNAMIQUE (Injecté par le routeur SPA)
    ========================================================================== -->
    <main id="app" class="flex-grow-1">
        <!-- Le contenu des pages (home.html, contact.html, etc.) s'affiche ici -->
    </main>

    <!-- ==========================================================================
    PIED DE PAGE COMMUN (SPA)
    ========================================================================== -->
    <footer class="bg-white border-top py-4 mt-auto">
        <div class="container text-center">
            <div class="d-flex flex-wrap justify-content-center align-items-center gap-3 gap-md-4 text-muted small mb-2">
                <span>B2V - Beach Volley Vibes</span>
                <span>•</span>
                <span>Email : <a href="mailto:contact@b2v-toulouse.fr" class="text-muted text-decoration-none">contact@b2v-toulouse.fr</a></span>
                <span>•</span>
                <span>&copy; 2026</span>
                <span>•</span>
                <a href="/mentions-legales" onclick="route()" class="text-muted text-decoration-none">Mentions Légales</a>
            </div>
            <div class="d-flex justify-content-center gap-3 text-muted small">
                <a href="/cgv" onclick="route()" class="text-muted text-decoration-none">CGV</a>
                <span>•</span>
                <a href="/reglement-interieur" onclick="route()" class="text-muted text-decoration-none">Règlement Intérieur</a>
            </div>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <!-- Scripts SPA & API -->
    <script type="module" src="Router/router.js"></script>
</body>
</html>
